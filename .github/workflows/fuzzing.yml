name: Fuzzing Tests

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/protocols/**'
      - 'src/internal/http/**'
      - 'src/internal/websocket/**'
      - 'src/internal/websocket_protocol.cpp'
      - 'src/internal/websocket_socket.cpp'
      - 'src/http/websocket_*.cpp'
      - '.github/workflows/fuzzing.yml'
      - 'src/internal/http_parser*'
      - 'src/internal/websocket_frame*'
      - 'include/kcenon/network/detail/protocols/**'
      - 'fuzz/**'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '300'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-24.04
    # Eight scheduled five-minute campaigns plus dependency builds and uploads.
    timeout-minutes: 60
    env:
      FUZZ_DURATION: ${{ github.event.inputs.fuzz_duration || (github.event_name == 'schedule' && '300') || '60' }}

    steps:
      - name: Checkout network_system
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: network_system

      - name: Checkout common_system
        uses: actions/checkout@v6
        with:
          repository: kcenon/common_system
          path: common_system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm \
            libgtest-dev libfmt-dev libssl-dev liblz4-dev zlib1g-dev python3

      - name: Install ASIO from source
        run: |
          # Ubuntu 24.04's libasio-dev (1.28.1) has a recycling allocator bug.
          # Install ASIO 1.32.0 from source for compatibility with sanitizers.
          curl --fail --location https://github.com/chriskohlhoff/asio/archive/asio-1-32-0.tar.gz -o asio.tar.gz
          tar xzf asio.tar.gz
          sudo mkdir -p /usr/local/include
          sudo cp -r asio-asio-1-32-0/asio/include/asio /usr/local/include/
          sudo cp asio-asio-1-32-0/asio/include/asio.hpp /usr/local/include/

      - name: Build common_system dependency
        run: |
          cd common_system
          CC=clang CXX=clang++ cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF
          cmake --build build
          cmake --install build --prefix ${{ github.workspace }}/deps/install

      - name: Generate seed corpus
        run: |
          cd network_system
          python3 fuzz/generate_corpus.py
          ls -la corpus/

      - name: Configure with Fuzzing
        run: |
          cd network_system
          CC=clang CXX=clang++ cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps/install \
            -DBUILD_FUZZING=ON \
            -DKCENON_WITH_COMMON_SYSTEM=ON \
            -DKCENON_WITH_LOGGER_SYSTEM=OFF \
            -DKCENON_WITH_THREAD_SYSTEM=OFF \
            -DKCENON_WITH_CONTAINER_SYSTEM=OFF \
            -DBUILD_MESSAGING_BRIDGE=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DASIO_INCLUDE_DIR=/usr/local/include \
            -DSKIP_ASIO_RECYCLING_WORKAROUND=ON

      - name: Build fuzz targets
        id: build_fuzz
        run: |
          cd network_system
          cmake --build build --target \
            fuzz_http2_frame \
            fuzz_quic_varint \
            fuzz_quic_frame \
            fuzz_grpc_frame \
            fuzz_hpack_decode \
            fuzz_websocket_frame \
            fuzz_websocket_handshake \
            fuzz_http_parser \
            network_websocket_frame_test \
            network_websocket_protocol_test \
            network_http_parser_test \
            network_websocket_server_loopback_test

      - name: Run parser security regressions
        working-directory: network_system
        run: ctest --test-dir build -L security --no-tests=error --output-on-failure

      - name: Validate fuzz duration
        id: duration
        run: |
          if [[ ! "$FUZZ_DURATION" =~ ^[0-9]{1,3}$ ]] || (( 10#$FUZZ_DURATION < 1 || 10#$FUZZ_DURATION > 300 )); then
            echo "::error::fuzz_duration must be an integer from 1 to 300"
            exit 1
          fi

      - name: Run http2_frame fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_http2_frame
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_http2_frame corpus/http2_frame \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_http2_frame.log

      - name: Run quic_varint fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_quic_varint
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_quic_varint corpus/quic_varint \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_quic_varint.log

      - name: Run quic_frame fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_quic_frame
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_quic_frame corpus/quic_frame \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_quic_frame.log

      - name: Run grpc_frame fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_grpc_frame
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_grpc_frame corpus/grpc_frame \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_grpc_frame.log

      - name: Run hpack_decode fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_hpack_decode
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_hpack_decode corpus/hpack_decode \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_hpack_decode.log

      - name: Run websocket_frame fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_websocket_frame
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_websocket_frame corpus/websocket_frame \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_websocket_frame.log

      - name: Run websocket_handshake fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_websocket_handshake
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_websocket_handshake corpus/websocket_handshake \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_websocket_handshake.log

      - name: Run http_parser fuzzing
        if: ${{ !cancelled() && steps.build_fuzz.outcome == 'success' && steps.duration.outcome == 'success' }}
        id: fuzz_http_parser
        working-directory: network_system
        run: |
          set -euo pipefail
          ./build/bin/fuzz_http_parser corpus/http_parser \
            -max_total_time="$FUZZ_DURATION" -timeout=10 -max_len=65536 \
            -rss_limit_mb=2048 -print_final_stats=1 2>&1 | tee fuzz_http_parser.log

      - name: Generate summary
        if: always()
        env:
          FUZZ_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Fuzzing results"
            echo "Job status: $FUZZ_JOB_STATUS"
            echo ""
            echo "| Target | Execution outcome |"
            echo "|--------|-------------------|"
            echo "| http2_frame | ${{ steps.fuzz_http2_frame.outcome }} |"
            echo "| quic_varint | ${{ steps.fuzz_quic_varint.outcome }} |"
            echo "| quic_frame | ${{ steps.fuzz_quic_frame.outcome }} |"
            echo "| grpc_frame | ${{ steps.fuzz_grpc_frame.outcome }} |"
            echo "| hpack_decode | ${{ steps.fuzz_hpack_decode.outcome }} |"
            echo "| websocket_frame | ${{ steps.fuzz_websocket_frame.outcome }} |"
            echo "| websocket_handshake | ${{ steps.fuzz_websocket_handshake.outcome }} |"
            echo "| http_parser | ${{ steps.fuzz_http_parser.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: network_system/corpus/
          retention-days: 90

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            network_system/crash-*
            network_system/fuzz_*.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-logs
          path: network_system/fuzz_*.log
          retention-days: 30
